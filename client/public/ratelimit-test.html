<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f8fafc; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-w: 800px; margin: 0 auto; }
    h1 { color: #0f172a; margin-top: 0; }
    p { color: #64748b; margin-bottom: 24px; }
    button { background: #FC8019; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ea6b05; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .stats { display: flex; gap: 40px; margin: 24px 0; font-size: 18px; font-weight: bold; }
    .stats .success { color: #10b981; }
    .stats .blocked { color: #ef4444; }
    #log { height: 400px; overflow-y: scroll; background: #1e293b; color: #f8fafc; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 14px; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>API Rate Limit Stress Test</h1>
    <p>This script will attempt to fire 1,000 requests to the CampusEats API instantly to test the express-rate-limit middleware settings (Max: 150 requests per IP per 15 minutes).</p>
    <button id="startBtn">🔥 Blast 1,000 Requests</button>
    
    <div class="stats">
      <div class="success">✅ Allowed (Processed by API): <span id="countSuccess">0</span></div>
      <div class="blocked">🛑 Blocked (429 Too Many Requests): <span id="countBlocked">0</span></div>
    </div>
    
    <div id="log"></div>
  </div>

  <script>
    document.getElementById('startBtn').addEventListener('click', async () => {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').innerText = 'Testing...';
      const logEl = document.getElementById('log');
      let success = 0;
      let blocked = 0;

      const fireRequest = async (i) => {
        try {
          const res = await fetch('http://localhost:5000/api/student/vendors');
          if(res.status === 429) {
            blocked++;
            logEl.innerHTML += `<div class="log-error">[REQ #${i}] => HTTP 429 (Too Many Requests! IP Limited)</div>`;
          } else if(res.status === 200 || res.status === 401) {
            success++;
            logEl.innerHTML += `<div class="log-success">[REQ #${i}] => HTTP ${res.status} (Allowed by Limiter)</div>`;
          } else {
            logEl.innerHTML += `<div>[REQ #${i}] => HTTP ${res.status}</div>`;
          }
          document.getElementById('countSuccess').innerText = success;
          document.getElementById('countBlocked').innerText = blocked;
          logEl.scrollTop = logEl.scrollHeight;
        } catch(e) {
          logEl.innerHTML += `<div>Error connecting</div>`;
        }
      };

      for(let i=1; i<=1000; i++) {
        fireRequest(i);
        if (i % 10 === 0) await new Promise(r => setTimeout(r, 10)); // Slight delay so browser doesn't freeze
      }
      
      setInterval(() => {
         if(success + blocked >= 1000) {
             document.getElementById('startBtn').innerText = 'Test Complete';
         }
      }, 500);
    });
  </script>
</body>
</html>
